version: 2
updates:
  # npm-avhengigheter — ukentlig, samlet i én PR for å redusere støy
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-avhengigheter:
        patterns:
          - "*"
    ignore:
      # Astro 7 er en brytende major (bygget feiler med «Astro is not defined»).
      # Hold på 6.x til migreringen tas bevisst og testes. Se ffh-tech-notes.
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]

  # GitHub Actions (checkout, setup-node m.fl.) — hold oppdatert
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
