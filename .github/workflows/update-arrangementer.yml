name: Oppdater arrangementer

on:
  schedule:
    # Én gang i døgnet (06:00 UTC) — arrangementer endrer seg sjelden
    - cron: '0 6 * * *'
  workflow_dispatch:  # Kan også kjøres manuelt fra GitHub UI

permissions:
  contents: write  # Nødvendig for å committe src/data/arrangementer.json
  actions: write   # Nødvendig for å utløse deploy-workflowen etter push
  issues: write    # Nødvendig for å åpne/lukke varselsak ved feil

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Sett opp Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'  # Node 20 er EOL (30. april 2026)

      - name: Hent kurs og konferanser (Nordland)
        run: node scripts/update-arrangementer.mjs

      - name: Commit og push (kun hvis endret)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/arrangementer.json
          if git diff --staged --quiet; then
            echo "Ingen endring — hopper over commit/push/deploy."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: oppdater arrangementer [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Push med GITHUB_TOKEN utløser IKKE andre workflows (GitHubs løkkevern),
      # så deploy.yml må startes eksplisitt — ellers når ikke nye data den
      # publiserte siden før neste menneskelige push.
      - name: Utløs deploy av siden
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      # Varsel: en feilet kjøring åpner ÉN sak (e-post til t-event), og saken
      # lukkes av seg selv når jobben virker igjen. Ingen ny kommentar per
      # feilet kjøring, så en jobb som feiler hver time ikke gir e-post hver time.
      # Jobben feilet før stille — i nov. 2026 gikk det 10 dager uoppdaget.
      - name: Varsle om feil (åpne sak)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITTEL='Automatisk jobb feiler: Oppdater arrangementer'
          nr=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$TITTEL\") | .number" | head -1)
          if [ -z "$nr" ]; then
            gh issue create --title "$TITTEL" --assignee t-event --body "Jobben «Oppdater arrangementer» feilet: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Kurs og konferanser på /aktuelt blir stående som de var ved siste vellykkede kjøring. Ofte skyldes det at fellesforbundet.no har endret seg.

          Saken lukkes automatisk når jobben går grønt igjen. Se VEDLIKEHOLD.md for feilsøking."
          fi

      - name: Lukk varsel når jobben virker igjen
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITTEL='Automatisk jobb feiler: Oppdater arrangementer'
          nr=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$TITTEL\") | .number" | head -1)
          if [ -n "$nr" ]; then
            gh issue close "$nr" --comment "Virker igjen: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
